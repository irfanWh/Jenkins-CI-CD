# TP3 - Azure Cloud-Native CI/CD
# Muhammad Irfan Wahyudi - II BDCC

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-24.04'

variables:
  acrName: 'acrirfantp3'
  acrRepository: 'tp3-webapp'

stages:

  - stage: CI
    displayName: 'Continuous Integration'

    jobs:

      - job: BuildTestPublish
        displayName: 'Build, Test and Publish Docker'

        steps:

          # STEP 1 - Checkout GitHub
          - checkout: self
            displayName: 'Checkout GitHub Repository'

          # STEP 2 - Docker Build
          - script: |
              set -eu

              echo "=== BUILD DOCKER IMAGE ==="

              docker build \
                -t tp3-webapp:$(Build.BuildId) .

              echo "=== BUILD SUCCESS ==="
            displayName: 'Build Docker Image'

          # STEP 3 - Test Application
          - script: |
              set -eu

              echo "=== TEST DOCKER IMAGE ==="

              docker run -d \
                --name tp3-test \
                tp3-webapp:$(Build.BuildId)

              trap 'docker rm -f tp3-test >/dev/null 2>&1 || true' EXIT

              sleep 3

              docker exec tp3-test \
                wget -qO- http://127.0.0.1 > page.html

              cat page.html

              grep -q "Welcome BDCC" page.html

              echo "=== ALL TESTS PASSED ==="
            displayName: 'Test Application'

          # STEP 4 - Publish to ACR
          - task: AzureCLI@2
            displayName: 'Publish Image to Azure Container Registry'

            inputs:
              azureSubscription: 'sc-azure-tp3'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'

              inlineScript: |
                set -euo pipefail

                echo "=== AUTHENTICATE WITH AZURE ==="

                ACR_LOGIN_SERVER=$(az acr show \
                  --name "$(acrName)" \
                  --resource-group "rg-tp3-azure-cicd" \
                  --query loginServer \
                  --output tsv)

                az acr login --name "$(acrName)"

                echo "=== TAG DOCKER IMAGE ==="

                docker tag \
                  tp3-webapp:$(Build.BuildId) \
                  "$ACR_LOGIN_SERVER/$(acrRepository):$(Build.BuildId)"

                echo "=== PUSH TO ACR ==="

                docker push \
                  "$ACR_LOGIN_SERVER/$(acrRepository):$(Build.BuildId)"

                echo "=== VERIFY IMAGE TAG ==="

                az acr repository show-tags \
                  --name "$(acrName)" \
                  --repository "$(acrRepository)" \
                  --output table

                echo "=== IMAGE PUBLISHED SUCCESSFULLY ==="